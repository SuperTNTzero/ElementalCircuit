plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

version = '0.14.0'
group = 'dev.elementalcircuits'
base { archivesName = 'elemental-circuits-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { elementalcircuits { source sourceSets.main } }
        }
        client {
            if (providers.gradleProperty('audioSmoke').orNull == 'true') {
                property 'elementalcircuits.audioSmoke', 'true'
                property 'elementalcircuits.vfxWorldSmoke', 'true'
                workingDirectory project.file('build/audio-world-smoke')
                mods { elementalcircuits { source sourceSets.test } }
            }
            if (providers.gradleProperty('vfxWorldSmoke').orNull == 'true') {
                property 'elementalcircuits.vfxWorldSmoke', 'true'
                workingDirectory project.file('build/world-visual-smoke')
                mods { elementalcircuits { source sourceSets.test } }
            }
            if (providers.gradleProperty('vfxSmoke').orNull == 'true') {
                property 'elementalcircuits.vfxSmoke', 'true'
                workingDirectory project.file('build/client-smoke')
                mods { elementalcircuits { source sourceSets.test } }
            }
            if (providers.gradleProperty('cursorSmoke').orNull == 'true') {
                property 'elementalcircuits.cursorSmoke', 'true'
                property 'elementalcircuits.cursorBaseline', providers.gradleProperty('cursorBaseline').orNull ?: 'false'
                workingDirectory project.file('build/cursor-smoke')
                mods { elementalcircuits { source sourceSets.test } }
            }
            if (providers.gradleProperty('editorSmoke').orNull == 'true' || providers.gradleProperty('bookSmoke').orNull == 'true') {
                property 'elementalcircuits.bookSmoke', providers.gradleProperty('bookSmoke').orNull ?: 'false'
                property 'elementalcircuits.editorSmoke', 'true'
                workingDirectory project.file('build/client-smoke')
                mods { elementalcircuits { source sourceSets.test } }
            }
        }
        server { args '--nogui'; workingDirectory project.file('run-server') }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'elementalcircuits'
            workingDirectory project.file('build/gametest')
            mods { elementalcircuits { source sourceSets.test } }
        }
    }
}
repositories {
    if (providers.gradleProperty('useDependencyMirror').orNull == 'true') {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'neoFmlArtifactMirror'
                    url = 'https://mirror.nju.edu.cn/bmclapi'
                    metadataSources { artifact() }
                }
            }
            filter { includeGroup 'net.neoforged.fancymodloader' }
        }
        maven {
            url = 'https://mirror.nju.edu.cn/bmclapi'
            content { includeGroupByRegex 'net\\.neoforged.*' }
            metadataSources { mavenPom(); artifact() }
        }
    }
    maven { url = 'https://maven.neoforged.net/releases'; content { includeGroupByRegex 'net\\.neoforged.*' } }
    maven { url = 'https://maven.minecraftforge.net'; content { includeGroupByRegex 'net\\.minecraftforge.*' } }
    mavenCentral()
}
dependencies { minecraft 'net.neoforged:forge:1.20.1-47.1.106' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure {
    manifest.attributes('Specification-Title': 'Elemental Circuits', 'Implementation-Version': project.version)
    finalizedBy 'reobfJar'
}
tasks.register('coreTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.elementalcircuits.domain.CoreContracts'
}
tasks.named('check') { dependsOn 'coreTest' }
